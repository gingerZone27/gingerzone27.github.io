<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Academic profile, research biography, and selected publications.">
  <title>Junjie Yang — Academic profile</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="profile.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="header">
    <nav aria-label="Main navigation">
      <a id="nav-personal" href="#personal" aria-current="page">Information</a>
      <a id="nav-research" href="#research">Biography</a>
      <a id="nav-publications" href="#publications">Publications</a>
    </nav>
  </header>
  <main id="main">
    <section id="personal" class="section personal" aria-labelledby="nav-personal">
      <div class="personal-content reveal"><p class="eyebrow" id="role"></p><h1 id="name" class="profile-name">Junjie Yang</h1><p class="profile-title" id="title"></p><p class="affiliation" id="affiliation"></p><p class="intro" id="intro"></p><div id="links" class="profile-links"></div></div>
    </section>
    <section id="research" class="section" aria-labelledby="nav-research">
      <div class="reveal"><div id="biography" class="biography"></div><ul id="interests" class="interests" aria-label="Research interests"></ul></div>
    </section>
    <section id="publications" class="section" aria-labelledby="nav-publications">
      <div class="publications-content">
        <ol id="publication-list" class="publication-list"></ol>
        <p id="empty-publications" class="empty-copy" hidden>Selected publications will appear here.</p>
      </div>
    </section>
  </main>
</body>
</html>
